name: driftprobe
description: Fail the build when an API or MCP tool your agent depends on still answers, but no longer delivers the data your agent needs.
branding:
  icon: activity
  color: orange
inputs:
  contracts:
    description: Contract files to check (shell glob, space separated)
    default: contracts/*.yaml
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    # The code that sees the job's secrets is the code of this tag, with the dependencies of its lockfile.
    - shell: bash
      run: npm ci --omit=dev --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        DRIFTPROBE_CONTRACTS: ${{ inputs.contracts }}
      run: node "$GITHUB_ACTION_PATH/bin/driftprobe.mjs" check --github ${DRIFTPROBE_CONTRACTS}
