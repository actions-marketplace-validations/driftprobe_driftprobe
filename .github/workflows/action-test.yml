name: action-test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Start the demo API and learn a contract
        run: |
          nohup node examples/demo-api.mjs > /dev/null 2>&1 &
          sleep 1
          node bin/driftprobe.mjs learn http://127.0.0.1:4010/products --name products --out contracts/products.yaml
      - name: A healthy source passes
        uses: ./
      - name: Degrade the source
        run: curl -s -X POST http://127.0.0.1:4010/__break
      - name: A degraded source fails
        id: broken
        continue-on-error: true
        uses: ./
      - name: Fail unless the degraded source was caught
        if: steps.broken.outcome != 'failure'
        run: exit 1
